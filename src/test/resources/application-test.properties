# Test profile — H2 + JWT secrets for unit/integration tests

spring.datasource.url=jdbc:h2:mem:practica_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=test-session-secret-key-at-least-32-chars!!
app.jwt.secret-master=test-master-secret-key-at-least-32-chars!!

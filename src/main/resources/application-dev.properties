# Dev-only values — loaded when spring.profiles.active=dev
# NEVER copy these secrets to production.
# Secrets match ms-auth application-dev.properties so the local stack interoperates.

# JWT aligned with ms-auth (session for SPA, master for Feign)
app.jwt.secret=dev-session-secret-key-for-local-development-only-x
app.jwt.secret-master=dev-master-secret-key-for-local-development-only-x

# H2 in-memory (no Postgres credentials required for local/CI)
spring.datasource.url=jdbc:h2:mem:practica_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway migrations target Postgres; Hibernate owns schema in local H2
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

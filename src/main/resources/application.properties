# ============================================================
# application.properties — base config (no secrets committed)
# Profile-specific overrides: application-dev.properties | application-prod.properties
# Activate explicitly: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

spring.application.name=microservicio-practica

server.servlet.context-path=/api
server.port=8082

# ── JWT (must match ms-auth secrets) ────────────────────────────────────────
# Session: APP_JWT_SECRET_SESSION (frontend Bearer).
# Master: APP_JWT_SECRET_MASTER (ms-auth Feign createParameter).
# Avoid nested ${A:${B}} — Spring still resolves B when A is an env var (breaks Docker).
app.jwt.secret=${APP_JWT_SECRET_SESSION}
app.jwt.secret-master=${APP_JWT_SECRET_MASTER:}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# ── H2 Console (enable only via application-dev.properties) ──────────────────
spring.h2.console.enabled=false

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── JPA (shared; dialect + ddl-auto + datasource live in profiles) ───────────
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

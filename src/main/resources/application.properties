# ============================================================
# application.properties — base config (no secrets committed)
# Profile-specific overrides: application-dev.properties
# ============================================================

spring.application.name=microservicio-practica
spring.profiles.active=dev

server.servlet.context-path=/api
server.port=8082

# ── JWT (must match ms-auth secrets) ────────────────────────────────────────
# Session: APP_JWT_SECRET_SESSION (frontend Bearer). Legacy alias: APP_JWT_SECRET.
# Master: APP_JWT_SECRET_MASTER (ms-auth Feign createParameter).
app.jwt.secret=${APP_JWT_SECRET_SESSION:${APP_JWT_SECRET}}
app.jwt.secret-master=${APP_JWT_SECRET_MASTER:}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# ── H2 Console (enable only via application-dev.properties) ──────────────────
spring.h2.console.enabled=false


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practica
      POSTGRES_USER: practica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practica -d practica"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  microservicio-practica:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_JWT_SECRET_SESSION: ${APP_JWT_SECRET_SESSION}
      APP_JWT_SECRET_MASTER: ${APP_JWT_SECRET_MASTER}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/practica
      SPRING_DATASOURCE_USERNAME: practica
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-practica}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "8082:8082"

volumes:
  pgdata:
